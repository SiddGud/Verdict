# Render blueprint. Secrets are set in the Render dashboard, never in this file. The private cache (Qloo,
# Ticketmaster and Last.fm replies, the recorded court sittings) is not in this repo: at start-up app.py downloads it
# from a private Hugging Face dataset (CACHE_DATASET) with HF_TOKEN. Qloo data stays out of the public repo.
services:
  - type: web
    name: clash-court
    runtime: python
    plan: free               # sleeps after 15 idle minutes; an uptime monitor every 5 minutes on /health keeps it awake
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: QLOO_API_KEY
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: COMET_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: CACHE_DATASET
        value: SiddGud/clash-court-cache
      - key: LLM_PROVIDER
        value: comet
      - key: DAILY_USD          # model spend cap per day for the public demo; tools without a model keep working
        value: "5"
      - key: ASKS_PER_HOUR
        value: "20"
